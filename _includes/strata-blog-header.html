<header id="header"
        {% if page.head-image %}
          {% if page.head-image contains '/' %}
            style="background: linear-gradient( rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.9) ), url('{{page.head-image}}') center top no-repeat; background-size: cover;"
          {% else %}
            style="background: linear-gradient( rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.9) ), url('/images/posts/{{page.head-image}}') center top no-repeat; background-size: cover;"
          {% endif %}
        {% else %}
          class="default-head-image"
        {% endif %}
        >
        <div class="inner">
          <a href="/" class="image avatar"><img src="/images/avatar.jpg" alt="" /></a>
          <h1 class="site-header">The Philosophy of Nate
          </h1>
          <span id="nav">
            <a href="/">Home</a><br />
            <a href="/projects">Projects</a><br />
            <a name="scroll-to"></a>
            <a href="/blog">Blog</a><br />
            <a href="/causes/net-neutrality">Net Neutrality</a><br />
            <a href="/books">Books</a><br />
            <!--
              <a href="/">Site Home</a><br />

              <a href="/blog/titles">Post List</a><br />

              <a href="/books">Books</a><br />                                <div class="scroll-down-link">
              <a class="icon fa-angle-double-down" href="#scroll-to"></a></div>
            -->

            <div class="scroll-down-link">
              <a class="fa solid fa-angle-double-down" href="#scroll-to"></a>
            </div>
          </span>

        </div>
        <!-- Footer -->
        <footer id="footer">
          <div class="inner">
            <ul class="icons">
              <li><a rel="me" href="https://mastodon.sdf.org/@thenaterhood" class="fa-brands fa-mastodon"></a></li>
              <li><a href="https://bsky.app/profile/thenaterhood.bsky.social" class="fa-brands fa-bluesky"></a></li>
              <li><a rel="me" href="https://github.com/thenaterhood" class="fa-brands fa-github"></a></li>
